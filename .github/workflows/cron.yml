name: NIMBO Scheduled Notifications

on:
  schedule:
    # Runs every 10 minutes as a cloud heartbeat backup
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NIMBO Cron Endpoint
        env:
          APP_URL: ${{ secrets.NIMBO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$APP_URL" ]; then
            curl -f -X GET "$APP_URL/api/cron/notifications" \
              -H "Authorization: Bearer $CRON_SECRET" || echo "Cron ping completed"
          else
            echo "NIMBO_URL secret not set. Skipping."
          fi
