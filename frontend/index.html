<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e11d68" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- PWA & Mobile Web App meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nimbo" />
    <meta name="application-name" content="Nimbo" />
    <meta name="description" content="NIMBO - Asistente personal inteligente de organización, agenda y recordatorios." />
    
    <!-- Icons with cache busting (Bot Mascot) -->
    <link rel="icon" type="image/svg+xml" href="/bot.svg?v=20261105c" />
    <link rel="shortcut icon" href="/bot.ico?v=20261105c" />
    <link rel="icon" type="image/png" sizes="32x32" href="/bot-32.png?v=20261105c" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20261105c" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261105c" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261105c" />
    
    <link rel="manifest" href="/manifest.json?v=bot2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <title>Nimbo — Asistente Personal</title>
    <script>
      // Capture PWA install prompt early before React bundle mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('nimbo:installable', { detail: e }));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker with auto-reload on update
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=bot9', { updateViaCache: 'none' })
            .then((reg) => {
              console.log('✓ NIMBO Service Worker registrado con éxito:', reg.scope);
              reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.warn('Fallo al registrar Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
